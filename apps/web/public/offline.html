<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senza connessione · Bacheca</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef2f7;
        --fg: #10427a;
        --muted: #4a5b73;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1f38;
          --fg: #e9eff7;
          --muted: #9fb3cd;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { max-width: 28rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 1.5rem; }
      button {
        font: inherit;
        padding: 0.6rem 1.4rem;
        border: 1px solid currentColor;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Sei senza connessione</h1>
      <p>
        Questa pagina non è fra quelle già scaricate. Le attività a cui sei
        iscritto restano consultabili anche offline.
      </p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
